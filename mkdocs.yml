site_name: MOA Wiki
site_description: Practitioner Guide per il MOA – Agentic Operating Model
site_url: https://luigiapp.github.io/MOA-WIKI/

nav:
  - "Home / Scopo": index.md
  - "Fase preliminare":
      - "01 – Preparazione": 01-preparazione.md
  - "MOA Portfolio":
      - "02 – Demand Generation": 02-demand-generation.md
      - "03 – Use Case Pipeline": 03-use-case-pipeline.md
      - "04 – MOA Scoring": 04-moa-scoring.md
      - "05 – Activation": 05-activation.md
  - "MOA Control Tower":
      - "06 – Process Risk Gate": 06-process-risk-gate.md
      - "07 – Governance & Controls": 07-governance-controls.md
      - "08 – Value Realization": 08-value-realization.md
      - "09 – Lifecycle Management": 09-lifecycle-management.md
      - "10 – Adoption & Capability": 10-adoption-capability.md
      - "11 – Scaling": 11-scaling.md
  - "Regole d'oro MOA": regole-doro.md

theme:
  name: material
  language: it
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro
plugins:
  - search:
      lang: it
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
